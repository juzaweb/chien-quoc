packages:
  - 'packages/*'
  - 'apps/*'

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - '@prisma/engines'
  - '@prisma/client'
  - prisma
  - workerd

minimumReleaseAgeExclude:
  - 'lucide-react@1.63.0'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
